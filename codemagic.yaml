workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: |
          VITE_BASE44_APP_ID=69bfd92e3db7d48eec6c8062 \
          VITE_BASE44_APP_BASE_URL=https://usetrackly.base44.app \
          npm run build

      - name: Install Capacitor CLI and plugins
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npm install @revenuecat/purchases-capacitor@^10.4.0
          npm install @capacitor/browser@^8.0.0

      - name: Write capacitor config (SPM mode)
        script: |
          rm -f capacitor.config.ts
          python3 -c "
          import json
          cfg = {
            'appId': 'com.base69bfd92e3db7d48eec6c8062.app',
            'appName': 'Trackly',
            'webDir': 'dist',
            'server': {'androidScheme': 'https', 'hostname': 'app'},
            'ios': {
              'contentInset': 'automatic',
              'allowsLinkPreview': False,
              'scrollEnabled': True,
              'limitsNavigationsToAppBoundDomains': False,
              'scheme': 'trackly',
              'backgroundColor': '#0a0a0a'
            }
          }
          open('capacitor.config.json','w').write(json.dumps(cfg, indent=2))
          print('capacitor.config.json written')
          "
          cat capacitor.config.json

      - name: Add and sync Capacitor iOS (SPM only — no CocoaPods)
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios

          # cap add ios will scaffold the Xcode project using SPM
          npx cap add ios

          # Sync web assets and plugin references into the project
          npx cap sync ios

          echo "--- Verifying NO Podfile exists (CocoaPods must not be present) ---"
          if [ -f ios/App/Podfile ]; then
            echo "ERROR: Podfile found — removing it so CocoaPods is not used"
            rm -f ios/App/Podfile ios/App/Podfile.lock
          else
            echo "OK: No Podfile — SPM is the sole integrator"
          fi

          echo "--- Package.swift contents ---"
          cat ios/App/App/Package.swift 2>/dev/null || cat ios/App/Package.swift 2>/dev/null || echo "No Package.swift found at expected paths"

          echo "--- project.pbxproj SPM sections ---"
          grep -c "XCRemoteSwiftPackageReference\|XCSwiftPackageProductDependency" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || true
          echo "--- Done ---"

      - name: Resolve Swift packages
        script: |
          WORKSPACE="ios/App/App.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "No xcworkspace — resolving from xcodeproj"
            xcodebuild -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App 2>&1
          else
            xcodebuild -resolvePackageDependencies \
              -workspace "$WORKSPACE" \
              -scheme App 2>&1
          fi

      - name: Register trackly:// URL scheme for OAuth deep-link
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 trackly" "$PLIST"
          echo "--- URL schemes registered ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Set export compliance
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Verify project structure
        script: |
          echo "--- Full ios/ tree ---"
          find ios -maxdepth 4 | sort
          echo "--- Web assets in bundle ---"
          ls ios/App/App/public/ | head -20 || echo "WARNING: No web assets found!"

      - name: Set build number
        script: |
          BUILD_NUM=$((BUILD_NUMBER + 10))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          # Prefer xcworkspace (created by SPM resolution), fall back to xcodeproj
          if [ -d "ios/App/App.xcworkspace" ]; then
            WORKSPACE="ios/App/App.xcworkspace"
            echo "Building with workspace: $WORKSPACE"
            xcode-project build-ipa \
              --workspace "$WORKSPACE" \
              --scheme "App" \
              --export-options-plist /Users/builder/export_options.plist
          else
            echo "Building with xcodeproj (no xcworkspace)"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App" \
              --export-options-plist /Users/builder/export_options.plist
          fi

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
