workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          VITE_BASE44_APP_ID=69bfd92e3db7d48eec6c8062 \
          VITE_BASE44_APP_BASE_URL=https://usetrackly.base44.app \
          npm run build
      - name: Install Capacitor CLI and plugins
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npm install @revenuecat/purchases-capacitor@^10.4.0
          npm install @capacitor/browser@^8.0.0
      - name: Add Capacitor iOS platform
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios
      - name: Convert iOS project to CocoaPods (required for Capacitor plugins)
        script: |
          # Patch Xcode project deployment target BEFORE sync
          find ios -name "project.pbxproj" | xargs sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' 2>/dev/null || true

          # Write Podfile BEFORE sync so cap sync uses it as a base
          cat > ios/App/Podfile << 'EOF'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '16.0'
          use_frameworks!

          install! 'cocoapods', :deterministic_uuids => false

          def capacitor_pods
          pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
          pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
          end

          target 'App' do
          capacitor_pods
          end
          EOF
          echo "--- Podfile before sync ---"
          cat ios/App/Podfile

      - name: Sync Capacitor
        script: |
          # Run sync WITHOUT pod install (we handle that ourselves)
          npx cap sync ios --no-deps

          # Remove stale CapApp-SPM folder (CocoaPods handles all plugins)
          rm -rf ios/App/CapApp-SPM || true

          # Scrub ALL CapApp-SPM references from the Xcode project file.
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "--- Removing CapApp-SPM references from project.pbxproj ---"
            sed -i '' '/CapApp-SPM/d' "$PBXPROJ"
            perl -i -0pe 's/[^\n]*CapApp[^\n]*\n//g' "$PBXPROJ" || true
            echo "--- Verifying no CapApp-SPM refs remain ---"
            grep -c "CapApp-SPM" "$PBXPROJ" && echo "WARNING: CapApp-SPM refs still present" || echo "OK: No CapApp-SPM refs found"
          fi

          # Re-patch deployment target in case sync regenerated it
          find ios -name "project.pbxproj" | xargs sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' 2>/dev/null || true

          # Re-write Podfile in case sync overwrote it
          cat > ios/App/Podfile << 'EOF'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '16.0'
          use_frameworks!

          install! 'cocoapods', :deterministic_uuids => false

          def capacitor_pods
          pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
          pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
          end

          target 'App' do
          capacitor_pods
          end
          EOF
          echo "--- Podfile after sync ---"
          cat ios/App/Podfile

      - name: Install CocoaPods
        script: |
          cd ios/App

          echo "--- RevenueCat package root contents ---"
          ls -la ../../node_modules/@revenuecat/purchases-capacitor/

          echo "--- RevenueCat podspec files ---"
          find ../../node_modules/@revenuecat/purchases-capacitor -name "*.podspec" -print

          # Dynamically detect the real podspec name
          PODSPEC_FILE=$(find ../../node_modules/@revenuecat/purchases-capacitor -name "*.podspec" | head -1)
          if [ -z "$PODSPEC_FILE" ]; then
            echo "FATAL: No .podspec found in @revenuecat/purchases-capacitor"
            exit 1
          fi
          PODSPEC_NAME=$(basename "$PODSPEC_FILE" .podspec)
          PODSPEC_DIR=$(dirname "$PODSPEC_FILE")
          # Make path relative to ios/App
          PODSPEC_REL_PATH=$(python3 -c "import os.path; print(os.path.relpath('$PODSPEC_DIR', '.'))")
          echo "--- Detected podspec: name=$PODSPEC_NAME path=$PODSPEC_REL_PATH ---"

          # Rewrite Podfile using the real podspec name and path
          cat > Podfile << EOF
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '16.0'
          use_frameworks!

          install! 'cocoapods', :deterministic_uuids => false

          def capacitor_pods
          pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
          pod '$PODSPEC_NAME', :path => '$PODSPEC_REL_PATH'
          end

          target 'App' do
          capacitor_pods
          end
          EOF
          echo "--- Final Podfile ---"
          cat Podfile

          echo "--- Running pod install ---"
          pod install --repo-update 2>&1
          POD_EXIT=$?
          echo "--- pod install exit code: $POD_EXIT ---"

          if [ $POD_EXIT -ne 0 ]; then
            echo "FATAL: pod install failed with exit code $POD_EXIT"
            exit $POD_EXIT
          fi

          echo "--- Contents of ios/App after pod install ---"
          ls -la

          echo "--- Podfile.lock RevenueCat entries ---"
          cat Podfile.lock | grep -A2 "RevenueCat\|Purchases\|$PODSPEC_NAME" || echo "WARNING: RevenueCat not found in Podfile.lock!"

          echo "--- Verifying CocoaPods workspace was created ---"
          if [ ! -d "App.xcworkspace" ]; then
            echo "FATAL: pod install did not create App.xcworkspace — aborting build"
            exit 1
          fi
          echo "SUCCESS: App.xcworkspace exists"

      - name: Register trackly:// URL scheme for OAuth deep-link
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 trackly" "$PLIST"
          echo "--- URL schemes registered ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Set export compliance
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Verify project structure
        script: |
          echo "--- Full ios/ tree ---"
          find ios -maxdepth 4 | sort
          echo "--- Web assets in bundle ---"
          ls ios/App/App/public/ | head -20 || echo "WARNING: No web assets found!"

      - name: Set build number
        script: |
          BUILD_NUM=$((BUILD_NUMBER + 10))
          agvtool new-version -all $BUILD_NUM || true
          find ios -name "*.xcodeproj" -maxdepth 3 | head -1 | xargs -I {} sh -c 'cd "{}/.." && agvtool new-version -all '"$BUILD_NUM"' || true'
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          echo "--- All xcworkspace files found ---"
          find ios -name "*.xcworkspace" -print

          WORKSPACE="ios/App/App.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Expected workspace not found at $WORKSPACE"
            exit 1
          fi

          echo "--- Workspace contents ---"
          find "$WORKSPACE" | sort

          echo "--- Listing schemes in workspace ---"
          xcodebuild -list -workspace "$WORKSPACE" 2>&1 || true

          echo "--- Show build settings for App scheme ---"
          xcodebuild -workspace "$WORKSPACE" -scheme "App" -showBuildSettings 2>&1 || true

          echo "--- Building IPA ---"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "App" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
