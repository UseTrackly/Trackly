workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: |
          VITE_BASE44_APP_ID=69bfd92e3db7d48eec6c8062 \
          VITE_BASE44_APP_BASE_URL=https://usetrackly.base44.app \
          npm run build

      - name: Install Capacitor CLI and plugins
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npm install @revenuecat/purchases-capacitor@^10.4.0
          npm install @capacitor/browser@^8.0.0

      - name: Write capacitor config
        script: |
          rm -f capacitor.config.ts
          python3 -c "
          import json
          cfg = {
            'appId': 'com.base69bfd92e3db7d48eec6c8062.app',
            'appName': 'Trackly',
            'webDir': 'dist',
            'server': {'androidScheme': 'https', 'hostname': 'app'},
            'ios': {
              'contentInset': 'automatic',
              'allowsLinkPreview': False,
              'scrollEnabled': True,
              'limitsNavigationsToAppBoundDomains': False,
              'scheme': 'trackly',
              'backgroundColor': '#0a0a0a'
            }
          }
          open('capacitor.config.json','w').write(json.dumps(cfg, indent=2))
          print('capacitor.config.json written')
          "
          cat capacitor.config.json

      - name: Scaffold iOS project
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios

      - name: Remove SPM from Xcode project (CocoaPods will be sole integrator)
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          python3 - <<'PYEOF'
          import re, sys

          path = "ios/App/App.xcodeproj/project.pbxproj"
          src  = open(path).read()

          src = re.sub(
              r'\s*[A-F0-9]{24} /\* [^*]+ \*/ = \{[^}]*isa = XCRemoteSwiftPackageReference[^}]*\};',
              '', src, flags=re.DOTALL)

          src = re.sub(
              r'\s*[A-F0-9]{24} /\* [^*]+ \*/ = \{[^}]*isa = XCSwiftPackageProductDependency[^}]*\};',
              '', src, flags=re.DOTALL)

          src = re.sub(r'\s*packageReferences = \([^)]*\);', '', src, flags=re.DOTALL)
          src = re.sub(r'\s*packageProductDependencies = \([^)]*\);', '', src, flags=re.DOTALL)

          open(path, 'w').write(src)

          remaining = [kw for kw in [
              'XCRemoteSwiftPackageReference',
              'XCSwiftPackageProductDependency',
              'packageReferences',
              'packageProductDependencies',
          ] if kw in src]
          if remaining:
              print(f"WARNING: SPM keywords still present: {remaining}", file=sys.stderr)
          else:
              print("OK: All SPM references removed from project.pbxproj")
          PYEOF

      - name: Sync Capacitor + install CocoaPods
        script: |
          npx cap sync ios

          echo "--- Podfile BEFORE injection ---"
          cat ios/App/Podfile

          python3 - <<'PYEOF'
          import re

          podfile_path = "ios/App/Podfile"
          src = open(podfile_path).read()

          injection = """
          # RevenueCat — injected by CI because cap sync may not auto-detect the pod
          pod 'PurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
          pod 'RevenueCat', '~> 5.0'
          """

          if "PurchasesCapacitor" not in src:
              src = re.sub(r'(target [\'"]App[\'"]\s*do.*?)(end)', 
                           lambda m: m.group(1) + injection + m.group(2),
                           src, count=1, flags=re.DOTALL)
              open(podfile_path, 'w').write(src)
              print("INJECTED: PurchasesCapacitor + RevenueCat pods into Podfile")
          else:
              print("OK: PurchasesCapacitor already present in Podfile — no injection needed")
          PYEOF

          echo "--- Podfile AFTER injection ---"
          cat ios/App/Podfile

          echo "--- Installing CocoaPods ---"
          cd ios/App
          pod install --repo-update

          echo "--- Pods installed. Full Pods directory listing: ---"
          ls -la Pods/ || echo "(Pods dir not found)"

          echo "--- All pod directories (top-level): ---"
          find Pods -maxdepth 1 -type d | sort

          echo "--- All .swift files anywhere in Pods: ---"
          find Pods -name "*.swift" | sort

          echo "--- All .podspec files in node_modules/@revenuecat: ---"
          find ../../node_modules/@revenuecat -name "*.podspec" 2>/dev/null | head -10 || \
          find node_modules/@revenuecat -name "*.podspec" 2>/dev/null | head -10 || \
          echo "(no podspec found)"

      - name: Verify RevenueCat native plugin is fully registered
        script: |
          set -e

          echo "=== CHECK 1: RevenueCat plugin Swift files in Pods ==="

          echo "--- Full Pods directory (all Swift files): ---"
          find ios/App/Pods -name "*.swift" | sort

          echo "--- All pod top-level directories: ---"
          find ios/App/Pods -maxdepth 1 -type d | sort

          PLUGIN_SWIFT=$(find ios/App/Pods -name "*.swift" | grep -i "purchase\|revenuecat" | head -1)
          if [ -n "$PLUGIN_SWIFT" ]; then
            echo "PASS: Found RevenueCat Swift file at $PLUGIN_SWIFT"
          else
            echo "FAIL: No RevenueCat/Purchases Swift files found anywhere in Pods"
            echo "--- Manifest.lock contents: ---"
            cat ios/App/Pods/Manifest.lock 2>/dev/null || echo "(no Manifest.lock)"
            exit 1
          fi

          echo ""
          echo "=== CHECK 2: CAPPlugins.m plugin registry ==="
          CAP_PLUGINS=$(find ios/App -name "CAPPlugins.m" 2>/dev/null | head -1)
          if [ -n "$CAP_PLUGINS" ]; then
            echo "CAPPlugins.m found at: $CAP_PLUGINS"
            cat "$CAP_PLUGINS"
            if grep -qi "purchase" "$CAP_PLUGINS"; then
              echo "PASS: Purchases plugin IS listed in CAPPlugins.m"
            else
              echo "FAIL: Purchases plugin NOT in CAPPlugins.m"
              exit 1
            fi
          else
            echo "WARNING: CAPPlugins.m not found — checking alternative registration"
            find ios/App -name "*.swift" | xargs grep -l "PurchasesCapacitor\|Purchases.register\|CAPPlugin" 2>/dev/null | head -5 || echo "(none found)"
          fi

          echo ""
          echo "=== CHECK 3: Pods/Manifest.lock ==="
          if grep -i "PurchasesCapacitor\|Purchases:" ios/App/Pods/Manifest.lock 2>/dev/null; then
            echo "PASS: PurchasesCapacitor confirmed in Manifest.lock"
          else
            echo "FAIL: PurchasesCapacitor NOT in Manifest.lock"
            cat ios/App/Pods/Manifest.lock 2>/dev/null | head -50
            exit 1
          fi

          echo ""
          echo "=== CHECK 4: capacitor.plugins.json ==="
          PLUGINS_JSON=$(find ios/App -name "capacitor.plugins.json" 2>/dev/null | head -1)
          if [ -n "$PLUGINS_JSON" ]; then
            echo "Found at: $PLUGINS_JSON"
            cat "$PLUGINS_JSON"
            if grep -qi "purchase" "$PLUGINS_JSON"; then
              echo "PASS: Purchases plugin IS in capacitor.plugins.json"
            else
              echo "FAIL: Purchases NOT in capacitor.plugins.json"
              exit 1
            fi
          else
            echo "INFO: capacitor.plugins.json not present (only used in some Capacitor versions)"
          fi

          echo ""
          echo "=== CHECK 5: Podfile includes PurchasesCapacitor pod ==="
          if grep -i "PurchasesCapacitor" ios/App/Podfile; then
            echo "PASS: PurchasesCapacitor is in Podfile"
          else
            echo "FAIL: PurchasesCapacitor NOT in Podfile"
            cat ios/App/Podfile
            exit 1
          fi

          echo ""
          echo "=== ALL CHECKS PASSED — RevenueCat plugin is properly registered ==="

      - name: Register trackly:// URL scheme
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Set export compliance
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Set build number
        script: |
          BUILD_NUM=$((BUILD_NUMBER + 10))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
