workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: |
          VITE_BASE44_APP_ID=69bfd92e3db7d48eec6c8062 \
          VITE_BASE44_APP_BASE_URL=https://usetrackly.base44.app \
          npm run build

      - name: Install Capacitor CLI and plugins
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npm install @revenuecat/purchases-capacitor@^10.4.0
          npm install @capacitor/browser@^8.0.0

      - name: Add Capacitor iOS platform
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor assets
        script: |
          # Only copy web assets and config — do NOT let Capacitor run pod install
          npx cap sync ios || true

      - name: Install CocoaPods
        script: |
          # Write Podfile after sync (sync may have overwritten it)
          cat > ios/App/Podfile << 'PODEOF'
require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

platform :ios, '16.0'
use_frameworks!

install! 'cocoapods', :deterministic_uuids => false

def capacitor_pods
  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
  pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
end

target 'App' do
  capacitor_pods
end
PODEOF

          echo "--- Podfile ---"
          cat ios/App/Podfile

          cd ios/App
          echo "--- Running pod install ---"
          pod install --repo-update
          POD_EXIT=$?
          echo "--- pod install exit code: $POD_EXIT ---"
          if [ $POD_EXIT -ne 0 ]; then
            exit $POD_EXIT
          fi

          if [ ! -d "App.xcworkspace" ]; then
            echo "FATAL: pod install did not create App.xcworkspace"
            exit 1
          fi
          echo "SUCCESS: App.xcworkspace exists"

          echo "--- Podfile.lock RevenueCat entries ---"
          grep -A2 "RevenueCat\|Purchases\|PurchasesCapacitor" Podfile.lock || echo "WARNING: RevenueCat not found in Podfile.lock!"

      - name: Register trackly:// URL scheme for OAuth deep-link
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 trackly" "$PLIST"
          echo "--- URL schemes registered ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Set export compliance
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Verify project structure
        script: |
          echo "--- Full ios/ tree ---"
          find ios -maxdepth 4 | sort
          echo "--- Web assets in bundle ---"
          ls ios/App/App/public/ | head -20 || echo "WARNING: No web assets found!"

      - name: Set build number
        script: |
          BUILD_NUM=$((BUILD_NUMBER + 10))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          WORKSPACE="ios/App/App.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Expected workspace not found at $WORKSPACE"
            exit 1
          fi

          echo "--- Listing schemes in workspace ---"
          xcodebuild -list -workspace "$WORKSPACE" 2>&1 || true

          echo "--- Building IPA ---"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "App" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false