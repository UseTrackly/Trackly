workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Install Capacitor CLI
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Add Capacitor iOS platform
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Verify project structure
        script: |
          echo "--- ios/App contents ---"
          ls -la ios/App/
          echo "--- Podfile? ---"
          ls ios/App/Podfile || echo "No Podfile (SPM project)"
          echo "--- xcworkspace? ---"
          find ios -name "*.xcworkspace" | head -5
          find ios -name "*.xcodeproj" | head -5
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true