workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Capacitor iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Debug - list ios directory
        script: |
          echo "=== Root listing ===" && ls -la
          echo "=== iOS dir ===" && ls -la ios/ || echo "No ios/ directory"
          echo "=== iOS/App dir ===" && ls -la ios/App/ || echo "No ios/App directory"
          find ios -name "Podfile" 2>/dev/null || echo "No Podfile found"
      - name: Install CocoaPods
        script: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -1)
          echo "Podfile found at: $PODFILE_DIR"
          cd "$PODFILE_DIR" && pod install
      - name: List iOS workspace files
        script: find ios -name "*.xcworkspace" | head -20
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true