workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Install Capacitor CLI
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Add Capacitor iOS platform
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Verify project structure
        script: |
          echo "--- Full ios/ tree ---"
          find ios -maxdepth 4 | sort
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -not -path "*/xcuserdata/*" | head -1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "App" \
            --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false