workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
        # Xcode 26+ altool can no longer determine the app's Apple ID from the
        # Bundle ID. Pass it explicitly so altool skips the broken lookup.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6762493484"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: |
          VITE_BASE44_APP_ID=69bfd92e3db7d48eec6c8062 \
          VITE_BASE44_APP_BASE_URL=https://usetrackly.base44.app \
          npm run build

      - name: Install Capacitor CLI and plugins
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npm install @revenuecat/purchases-capacitor@^10.4.0
          npm install @capacitor/browser@^8.0.0
          npm install @capacitor/camera@^8.0.0

      - name: Write capacitor config
        script: |
          rm -f capacitor.config.ts
          python3 -c "
          import json
          cfg = {
            'appId': 'com.base69bfd92e3db7d48eec6c8062.app',
            'appName': 'Trackly',
            'webDir': 'dist',
            'server': {'androidScheme': 'https', 'hostname': 'app'},
            'ios': {
              'contentInset': 'automatic',
              'allowsLinkPreview': False,
              'scrollEnabled': True,
              'limitsNavigationsToAppBoundDomains': False,
              'scheme': 'trackly',
              'backgroundColor': '#0a0a0a',
              'minVersion': '15.0'
            }
          }
          open('capacitor.config.json','w').write(json.dumps(cfg, indent=2))
          print('capacitor.config.json written')
          "
          cat capacitor.config.json

      - name: Scaffold iOS project
        script: |
          git rm -rf ios --ignore-unmatch || true
          rm -rf ios
          npx cap add ios

      - name: Inject permissions into Info.plist template (before cap sync)
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "--- Injecting permissions into scaffolded Info.plist ---"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Trackly needs camera access to take photos of your items and profile picture.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Trackly needs camera access to take photos of your items and profile picture.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Trackly needs photo library access to select photos for your items and profile picture.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Trackly needs photo library access to select photos for your items and profile picture.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Trackly needs permission to save photos to your photo library.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Trackly needs permission to save photos to your photo library.'" "$PLIST"

          echo "Pre-sync permissions:"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"

      # ── CRITICAL: strip all SPM references from the Xcode project before
      # cap sync so that CocoaPods becomes the sole native integrator for
      # Capacitor plugins (including RevenueCat).  If SPM refs remain,
      # Capacitor.framework and Cordova.framework get linked twice → archive fails.
      - name: Remove SPM from Xcode project (CocoaPods will be sole integrator)
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          python3 - <<'PYEOF'
          import re, sys

          path = "ios/App/App.xcodeproj/project.pbxproj"
          src  = open(path).read()

          # 1. Delete every XCRemoteSwiftPackageReference block
          src = re.sub(
              r'\s*[A-F0-9]{24} /\* [^*]+ \*/ = \{[^}]*isa = XCRemoteSwiftPackageReference[^}]*\};',
              '', src, flags=re.DOTALL)

          # 2. Delete every XCSwiftPackageProductDependency block
          src = re.sub(
              r'\s*[A-F0-9]{24} /\* [^*]+ \*/ = \{[^}]*isa = XCSwiftPackageProductDependency[^}]*\};',
              '', src, flags=re.DOTALL)

          # 3. Delete packageReferences array entries inside PBXProject
          src = re.sub(r'\s*packageReferences = \([^)]*\);', '', src, flags=re.DOTALL)

          # 4. Delete packageProductDependencies array entries inside PBXNativeTarget
          src = re.sub(r'\s*packageProductDependencies = \([^)]*\);', '', src, flags=re.DOTALL)

          open(path, 'w').write(src)

          # Verify
          remaining = [kw for kw in [
              'XCRemoteSwiftPackageReference',
              'XCSwiftPackageProductDependency',
              'packageReferences',
              'packageProductDependencies',
          ] if kw in src]
          if remaining:
              print(f"WARNING: SPM keywords still present: {remaining}", file=sys.stderr)
          else:
              print("OK: All SPM references removed from project.pbxproj")
          PYEOF

      - name: Set iOS deployment target in Xcode project
        script: |
          # Capacitor 8 requires iOS 15.0 minimum
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" ios/App/App/Info.plist
          
          # Update project.pbxproj IPHONEOS_DEPLOYMENT_TARGET
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PBXPROJ"
          echo "Set iOS deployment target to 15.0"

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Inject iOS permissions into Info.plist (after cap sync)
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "--- Injecting permissions into Info.plist ---"

          # NSCameraUsageDescription
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Trackly needs camera access to take photos of your items and profile picture.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Trackly needs camera access to take photos of your items and profile picture.'" "$PLIST"

          # NSPhotoLibraryUsageDescription
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Trackly needs photo library access to select photos for your items and profile picture.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Trackly needs photo library access to select photos for your items and profile picture.'" "$PLIST"

          # NSPhotoLibraryAddUsageDescription
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Trackly needs permission to save photos to your photo library.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Trackly needs permission to save photos to your photo library.'" "$PLIST"

          # Verify
          echo "NSCameraUsageDescription: $(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST")"
          echo "NSPhotoLibraryUsageDescription: $(/usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$PLIST")"
          echo "NSPhotoLibraryAddUsageDescription: $(/usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$PLIST")"

      - name: Write Podfile with post_install hook
        script: |
          mkdir -p ios/App
          cat > ios/App/Podfile << 'PODEOF'
platform :ios, '15.0'
use_frameworks!

target 'App' do
  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorCamera', :path => '../../node_modules/@capacitor/camera'
  pod 'RevenuecatPurchasesCapacitor', :path => '../../node_modules/@revenuecat/purchases-capacitor'
end

post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
      config.build_settings['iOS Deployment Target'] = '15.0'
    end
  end
end
PODEOF
          echo "--- Podfile written: ---"
          cat ios/App/Podfile

      - name: Install CocoaPods
        script: |
          cd ios/App
          if ! pod install --repo-update 2>&1; then
            echo "FATAL: pod install failed"
            echo "--- Podfile: ---"
            cat Podfile
            echo "--- Directory: ---"
            ls -la
            exit 1
          fi
          echo "--- pod install succeeded ---"
          ls -la Pods/
          find Pods -maxdepth 1 -type d | sort

      - name: Force all pod targets to iOS 15.0
        script: |
          cd ios/App
          # Update Pod target deployment targets in Pods project
          PODS_XCPROJ="Pods/Pods.xcodeproj/project.pbxproj"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PODS_XCPROJ"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PODS_XCPROJ"
          
          # Update Pod target settings in xcconfig files
          find Pods/Target\ Support\ Files -name "*.xcconfig" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;
          find Pods/Target\ Support\ Files -name "*.xcconfig" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;
          
          echo "Forced all Pod targets to iOS 15.0"

      - name: Register trackly:// URL scheme
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string trackly" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 trackly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Generate app icons from Trackly logo
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          # Download the master icon (1024x1024 source)
          curl -fsSL "https://media.base44.com/images/public/69bfd92e3db7d48eec6c8062/5d245cd07_app_icon_1024.png" \
            -o /tmp/trackly_icon_master.png

          # Trim white margins and fill 1024×1024 edge-to-edge (no letterboxing)
          pip3 install Pillow --quiet 2>/dev/null
          python3 << 'PYEOF'
          from PIL import Image, ImageChops
          img = Image.open('/tmp/trackly_icon_master.png').convert('RGB')
          # Auto-trim near-white background so the circle fills the frame
          bg = Image.new('RGB', img.size, (255, 255, 255))
          bbox = ImageChops.difference(img, bg).getbbox()
          if bbox:
              img = img.crop(bbox)
          img = img.resize((1024, 1024), Image.LANCZOS)
          img.save('/tmp/trackly_icon_1024.png', 'PNG')
          print(f"Icon trimmed & filled: {img.size}")
          PYEOF

          # Generate all required sizes using sips
          generate_icon() {
            local size=$1
            local filename=$2
            sips -z $size $size /tmp/trackly_icon_1024.png --out "$ICON_DIR/$filename"
          }

          generate_icon 20   "Icon-20.png"
          generate_icon 40   "Icon-20@2x.png"
          generate_icon 60   "Icon-20@3x.png"
          generate_icon 29   "Icon-29.png"
          generate_icon 58   "Icon-29@2x.png"
          generate_icon 87   "Icon-29@3x.png"
          generate_icon 40   "Icon-40.png"
          generate_icon 80   "Icon-40@2x.png"
          generate_icon 120  "Icon-40@3x.png"
          generate_icon 120  "Icon-60@2x.png"
          generate_icon 180  "Icon-60@3x.png"
          generate_icon 76   "Icon-76.png"
          generate_icon 152  "Icon-76@2x.png"
          generate_icon 167  "Icon-83.5@2x.png"
          generate_icon 1024 "Icon-1024.png"

          # Write Contents.json
          cat > "$ICON_DIR/Contents.json" << 'ICONEOF'
          {
            "images": [
              { "idiom": "iphone", "scale": "2x", "size": "20x20",   "filename": "Icon-20@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "20x20",   "filename": "Icon-20@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "29x29",   "filename": "Icon-29@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "29x29",   "filename": "Icon-29@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "40x40",   "filename": "Icon-40@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "40x40",   "filename": "Icon-40@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "60x60",   "filename": "Icon-60@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "60x60",   "filename": "Icon-60@3x.png" },
              { "idiom": "ipad",   "scale": "1x", "size": "20x20",   "filename": "Icon-20.png" },
              { "idiom": "ipad",   "scale": "2x", "size": "20x20",   "filename": "Icon-20@2x.png" },
              { "idiom": "ipad",   "scale": "1x", "size": "29x29",   "filename": "Icon-29.png" },
              { "idiom": "ipad",   "scale": "2x", "size": "29x29",   "filename": "Icon-29@2x.png" },
              { "idiom": "ipad",   "scale": "1x", "size": "40x40",   "filename": "Icon-40.png" },
              { "idiom": "ipad",   "scale": "2x", "size": "40x40",   "filename": "Icon-40@2x.png" },
              { "idiom": "ipad",   "scale": "1x", "size": "76x76",   "filename": "Icon-76.png" },
              { "idiom": "ipad",   "scale": "2x", "size": "76x76",   "filename": "Icon-76@2x.png" },
              { "idiom": "ipad",   "scale": "2x", "size": "83.5x83.5","filename": "Icon-83.5@2x.png" },
              { "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024", "filename": "Icon-1024.png" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          ICONEOF

          echo "--- App icons generated ---"
          ls -la "$ICON_DIR"

      - name: Ensure Xcode target uses AppIcon asset
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          # Make sure ASSETCATALOG_COMPILER_APPICON_NAME is set to AppIcon
          if grep -q "ASSETCATALOG_COMPILER_APPICON_NAME" "$PBXPROJ"; then
            sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = [^;]*/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon/g' "$PBXPROJ"
          else
            # Insert it into each Release and Debug build settings block
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER/a\
                ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' "$PBXPROJ"
          fi
          echo "ASSETCATALOG_COMPILER_APPICON_NAME set to AppIcon"
          grep "ASSETCATALOG_COMPILER_APPICON_NAME" "$PBXPROJ" | head -5

      - name: Set export compliance
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Set build number
        script: |
          BUILD_NUM=$((BUILD_NUMBER + 10))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist || true

      - name: Force App target and all dependencies to iOS 15.0
        script: |
          # Update main app project deployment target
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PBXPROJ"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PBXPROJ"
          
          # Update Pods.xcodeproj (generated by CocoaPods)
          PODS_PBXPROJ="ios/App/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PODS_PBXPROJ" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PODS_PBXPROJ"
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PODS_PBXPROJ"
            echo "Updated Pods.xcodeproj deployment targets"
          fi
          
          # Update RevenueCatPurchasesCapacitor target specifically
          if [ -f "$PODS_PBXPROJ" ]; then
            grep -n "RevenueCat" "$PODS_PBXPROJ" | head -5 || true
          fi
          
          echo "Forced all project targets to iOS 15.0"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --export-options-plist /Users/builder/export_options.plist

      - name: Publish to App Store Connect (explicit Apple ID)
        script: |
          # ── Bypass altool's broken Bundle ID → Apple ID lookup ──────────────
          # Xcode 26+ altool fails with "Cannot determine the Apple ID from
          # Bundle ID". We pass the numeric App Store Connect Apple ID
          # (6762493484) directly to altool via --altool-additional-arguments
          # so altool skips the broken lookup entirely.
          set -e

          echo "=== Codemagic CLI version ==="
          app-store-connect --version

          IPA_PATH=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "FATAL: No IPA found in build/ios/ipa/"
            exit 1
          fi
          echo "Publishing IPA: $IPA_PATH"

          # Write private key to temp file to avoid shell newline-escaping issues
          KEY_FILE="/tmp/asc_private_key.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "=== Uploading to App Store Connect (Apple ID: 6762493484) ==="
          app-store-connect publish \
            --path "$IPA_PATH" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@file:$KEY_FILE" \
            --altool-additional-arguments "--apple-id 6762493484" \
            --altool-verbose-logging \
            --testflight \
            --max-build-processing-wait 20

          rm -f "$KEY_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - noreply@trackly.app