workflows:
  ios-workflow:
    name: Trackly iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24.15.0
      vars:
        BUNDLE_ID: com.base69bfd92e3db7d48eec6c8062.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base69bfd92e3db7d48eec6c8062.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add and sync Capacitor iOS + CocoaPods
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          rm -rf ios
          npx cap add ios || { echo "cap add ios failed"; exit 1; }
          npx cap sync ios || { echo "cap sync ios failed"; exit 1; }
          ls -la ios/App/
          if [ ! -f ios/App/Podfile ]; then
            echo "ERROR: Podfile not found after cap add ios"
            exit 1
          fi
          cd ios/App && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true